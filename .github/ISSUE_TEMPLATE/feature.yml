name: Feature request
description: Suggest a focused improvement
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What task is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and a concrete example
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: How could we verify it with real Packet Tracer behavior?
