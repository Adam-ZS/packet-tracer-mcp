[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "packettracer-evidence-mcp"
version = "0.1.0"
description = "Control live Packet Tracer labs and capture real, verifiable screenshot evidence over MCP."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "Adam Soman"}]
keywords = ["mcp", "packet-tracer", "networking", "cisco", "screenshots"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: System :: Networking",
]
dependencies = ["mcp>=1.30,<2", "Pillow>=11,<13", "python-docx>=1.2,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1.2,<2"]
desktop = ["PyAutoGUI>=0.9.54,<1"]

[project.scripts]
pt-evidence = "packettracer_evidence_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/Adam-ZS/packettracer-evidence-mcp"
Issues = "https://github.com/Adam-ZS/packettracer-evidence-mcp/issues"
Documentation = "https://github.com/Adam-ZS/packettracer-evidence-mcp/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/packettracer_evidence_mcp"]

[tool.hatch.build.targets.sdist]
include = [
  "/src", "/tests", "/examples", "/docs", "/README.md", "/LICENSE",
  "/THIRD_PARTY_NOTICES.md", "/CONTRIBUTING.md", "/CODE_OF_CONDUCT.md",
  "/SECURITY.md", "/CHANGELOG.md", "/pyproject.toml", "/.github",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=.pytest-tmp"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".local", ".venv", "workspace", ".pytest-tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
