<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" role="img" aria-labelledby="title desc">
  <title id="title">How Packet Tracer MCP works</title>
  <desc id="desc">A local MCP client calls the server over stdio. The server talks to the Control Center mailbox and Packet Tracer, then saves original and cropped evidence.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="m0 0 8 4-8 4" fill="none" stroke="#5e8ca7"/></marker></defs>
  <rect width="1200" height="290" rx="18" fill="#0c1d30"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g fill="#153047" stroke="#365b76"><rect x="35" y="45" width="220" height="88" rx="12"/><rect x="338" y="45" width="220" height="88" rx="12"/><rect x="642" y="45" width="220" height="88" rx="12"/><rect x="945" y="45" width="220" height="88" rx="12"/></g>
    <g fill="#f1f7fc" font-size="18" font-weight="700"><text x="145" y="83">Your MCP client</text><text x="448" y="83">Packet Tracer MCP</text><text x="752" y="83">Control Center</text><text x="1055" y="83">Packet Tracer</text></g>
    <g fill="#8bb1cb" font-size="13"><text x="145" y="108">Your selected agent</text><text x="448" y="108">Typed tools + checks</text><text x="752" y="108">Upstream extension</text><text x="1055" y="108">Real devices + real state</text></g>
    <g stroke="#5e8ca7" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M265 90h62"/><path d="M568 90h62"/><path d="M872 90h62"/><path d="M448 144v37h302v25"/></g>
    <g fill="#8bb1cb" font-size="11"><text x="296" y="71">stdio</text><text x="599" y="71">mailbox</text><text x="903" y="71">IPC API</text></g>
    <rect x="520" y="208" width="460" height="52" rx="10" fill="#123c42" stroke="#3ccdb3"/>
    <text x="750" y="231" fill="#7debd0" font-size="15" font-weight="700">Original PNG → Exact crop → Manifest → DOCX</text>
    <text x="750" y="250" fill="#93c4c6" font-size="11">Local workspace files. No screenshot reconstruction.</text>
    <text x="148" y="251" fill="#6588a2" font-size="12">All application control stays local.</text>
  </g>
</svg>
